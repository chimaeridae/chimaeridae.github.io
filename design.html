<body>

                        <figure>
                            <h3>individual</h3>

                                src="design/icon_cd-i_1.png"
                                data-project="characterdesign-individual"
                                alt="character design - individual">
                        </figure>
                    </section>

                    <section>

                        <figure>
                            <h3>hiraeth</h3>
                            <img class="design-image"
                                src="https://64.media.tumblr.com/32527f59aec1437a9f34ce6b937c3cf9/ab6ade6ee5cb1193-ba/s1280x1920/d2c7246368e5198b6270f53e67781a55d3e61857.jpg"
                                data-project="concept-hiraeth"
                                alt="concept art - hiraeth">
                        </figure>

                        <figure>
                            <h3>fold</h3>
                            <img class="design-image"
                                src="https://cdn.bsky.app/img/feed_fullsize/plain/did:plc:sfjy36y7wysopcmt5w4qpz2g/bafkreigymrivlcf6qelfcyzwh6yzrjonhatqr2ltwhn3ae2low5glekpsa@jpeg"

                    <!-- Lightbox -->
                    <div id="lightbox" style="display:none;">
                        <div id="lightbox-container"></div>
                        <p id="lightbox-caption"></p>
                        <div class="lightbox-controls">

                        </ul>
                    </nav>

            </div>
        </div>
    </div>

    <script>
    // Image groups
    const projectImages = {
        "characterdesign-individual": [
            ["design/icon_cd-i_1.png"],
            ["works1-2.png"],
            ["works1-3.png"],
            ["works1-4.gif", "works1-5.gif"]
        ],
        "characterdesign-hiraeth": [
            ["https://64.media.tumblr.com/c9df2323c303a102e6348fc493231bea/ef337c8576f71a4f-25/s1280x1920/4aa6a23924e2e4594bf0417b0b061bac4100358c.jpg"],
            ["https://64.media.tumblr.com/fa5f77972c286a2b7327df23c89e5cb9/af50fce9c2702f4b-9a/s1280x1920/3aed4e960a517858185b9418b1fb0939e310829c.jpg"],
            ["https://64.media.tumblr.com/43ffab3a9c4f8f2f2e55c61147b847da/f470a609232d511c-88/s1280x1920/bfaf3a75d49a81e6f4448880a69ee05d59c92717.jpg", "https://64.media.tumblr.com/eeb27f102e915d6d5f229efb94fa646a/f470a609232d511c-95/s1280x1920/3740daaa952fe12966733ea5119575417d2a279a.jpg"]
        ],
        "characterdesign-fold": [
            ["works3.png"],
            ["works3-2.png"],
            ["works3-3.png"]
        ],
        "concept-hiraeth": [
            ["https://64.media.tumblr.com/4b33d3b64a8f4dfe04f78e640f70f6e7/529f3999ae50adf2-d1/s1280x1920/42b3134f92bc8b9461b3ff8481300fba790c4147.jpg"],
            ["https://64.media.tumblr.com/fa31c1c49216f8444ae77392b43f308b/529f3999ae50adf2-3e/s1280x1920/4b50540a8d194e2101775574578fe143ca30fe00.jpg"],
            ["works4-3.png"]
        ],
        "concept-fold": [
            ["https://cdn.bsky.app/img/feed_fullsize/plain/did:plc:sfjy36y7wysopcmt5w4qpz2g/bafkreicbcv5ahfxz43hkqxmjgmw7ccw63ka4izfcctmbadmzis5o4yhsua@jpeg"],
            ["https://cdn.bsky.app/img/feed_fullsize/plain/did:plc:sfjy36y7wysopcmt5w4qpz2g/bafkreigymrivlcf6qelfcyzwh6yzrjonhatqr2ltwhn3ae2low5glekpsa@jpeg"],
            ["https://cdn.bsky.app/img/feed_fullsize/plain/did:plc:sfjy36y7wysopcmt5w4qpz2g/bafkreicngnuunzah2mr2y3eowosun677zhw77i3a4rzv6p7plnq5en2fse@jpeg"]
        ]
    };

    // Captions (one per set)
    const projectCaptions = {
        "characterdesign-individual": ["1", "2", "3", "4"],
        "characterdesign-hiraeth": ["hiraeth's ly", "hiraeth's eel", "hiraeth's mariette"],
        "characterdesign-fold": ["1", "2", "3"],
        "concept-hiraeth": ["1", "2", "3"],
        "concept-fold": ["1", "2", "3"]
    };

    const lightbox = document.getElementById("lightbox");
    const lightboxContainer = document.getElementById("lightbox-container");
    const lightboxCaption = document.getElementById("lightbox-caption");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");

    let currentGroup = [];
    let currentCaptions = [];
    let currentIndex = 0;

    document.querySelectorAll(".design-image").forEach(img => {
        img.addEventListener("click", () => {
            const key = img.dataset.project;
            if (!projectImages[key]) return;

            currentGroup = projectImages[key];
            currentCaptions = projectCaptions[key] || [];

            const clickedSrc = normalizePath(img.getAttribute("src"));
            currentIndex = currentGroup.findIndex(set => set.some(src => pathsMatch(src, clickedSrc)));
            if (currentIndex === -1) currentIndex = 0;

            showLightbox();
        });
    });

    function normalizePath(path) {
        if (!path) return "";
        return path
            .replace(/\\/g, "/")
            .replace(/^https?:\/\/[^/]+\//, "")
            .replace(/^\.?\//, "")
            .replace(/^\/+/, "");
    }

    function pathsMatch(a, b) {
        return normalizePath(a) === normalizePath(b);
    }

    function showLightbox() {
        lightboxContainer.innerHTML = "";
        lightbox.style.display = "flex";
        if (!currentGroup || !currentGroup[currentIndex]) return;

        currentGroup[currentIndex].forEach(src => {
            let el;
            if (/\.(ogg|mp3|wav)$/i.test(src)) {
                el = document.createElement("audio");
                el.controls = true;
                el.src = src;
            } else {
                el = document.createElement("img");
                el.className = "lightbox-image";
                el.src = src;
                el.alt = "";
            }
            lightboxContainer.appendChild(el);
        });

        lightboxCaption.textContent = currentCaptions[currentIndex] || "";
    }

    prevButton.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!currentGroup || currentGroup.length === 0) return;
        currentIndex = (currentIndex - 1 + currentGroup.length) % currentGroup.length;
        showLightbox();
    });

    nextButton.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!currentGroup || currentGroup.length === 0) return;
        currentIndex = (currentIndex + 1) % currentGroup.length;
        showLightbox();
    });

    lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) lightbox.style.display = "none";
    });
    </script>
</body>
</html>
